name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev tar graphviz autoconf libtool pkg-config
          pip install --upgrade pip setuptools wheel
          pip install "Cython<3.0.0" buildozer Kivy==2.3.0

      - name: Accept Android Licenses Automatically
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Android litsenziyalarini avtomat qabul qilish buyrug'i
          yes | buildozer android licenses

      - name: Build with Buildozer
        run: |
          YES=1 buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-APK
          path: bin/*.apk
